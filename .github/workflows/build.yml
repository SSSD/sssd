name: Build
on:
  push:
  pull_request:
    # do not run if only system tests were edited inside a pull request
    paths-ignore:
    - 'src/tests/system/**'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  make-distcheck:
    if: github.event_name == 'push' || !contains(github.event.pull_request.labels.*.name, 'Accepted')
    runs-on: ubuntu-latest
    container: quay.io/sssd/ci-client-devel:centos-9
    permissions:
      contents: read
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Install dependencies
      id: dependencies
      uses: ./.github/actions/install-dependencies

    - name: Configure sssd
      uses: ./.github/actions/configure

    - name: make
      shell: bash
      working-directory: x86_64
      run: |
        source ../contrib/fedora/bashrc_sssd
        # -g3 includes macro definitions in debug info, for better
        # backtraces/suppressions in the make check-valgrind step below.
        make CFLAGS+="$SSS_WARNINGS -Werror -g3" -j$PROCESSORS

    - name: make check
      shell: bash
      working-directory: x86_64
      run: |
        source ../contrib/fedora/bashrc_sssd
        make CFLAGS+="$SSS_WARNINGS -Werror -g3" -j$PROCESSORS check

    - name: make check-valgrind
      shell: bash
      working-directory: x86_64
      run: |
        source ../contrib/fedora/bashrc_sssd
        ../contrib/ci/check-valgrind -j$PROCESSORS

    - name: make distcheck
      shell: bash
      working-directory: x86_64
      run: |
        source ../contrib/fedora/bashrc_sssd

        # parallel distcheck is full of race conditions
        # -g3 matches the debug info level used by the make/make check steps above.
        make -j1 distcheck DISTCHECK_CONFIGURE_FLAGS="CFLAGS=-g3"

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: build
        path: |
          x86_64/config.log
          x86_64/config.h
          x86_64/test-suite.log
          x86_64/**/*.valgrind.log
        if-no-files-found: ignore
