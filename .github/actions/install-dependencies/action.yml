name: 'Install dependencies'
description: 'Install dependencies to build sssd'
inputs:
  working-directory:
    description: Working directory.
    required: false
    default: '.'
runs:
  using: "composite"
  steps:
  - shell: bash
    working-directory: ${{ inputs.working-directory }}
    run: |
      export PATH="$PWD/contrib/ci:$PATH"
      . contrib/ci/deps.sh
      deps_install
