[tool.mypy]
exclude = "docs"

[[tool.mypy.overrides]]
module = "jc.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ldap.*"
ignore_missing_imports = true

[tool.ruff]
line-length = 119
exclude = [".venv"]

[tool.ruff.lint]
# E/W ≈ pycodestyle, F ≈ pyflakes/flake8, I ≈ isort; defaults are Black-compatible
select = ["E", "W", "F", "I"]

[tool.ruff.lint.pycodestyle]
max-line-length = 119

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.black]
line-length = 119
